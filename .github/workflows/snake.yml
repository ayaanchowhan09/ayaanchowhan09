name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate purple contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237c3aed&color_dots=%23eeeaf5,%23ddd6fe,%23c4b5fd,%23a78bfa,%237c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23c084fc&color_dots=%23110a19,%23251336,%234c1d72,%237c3aed,%23e879f9

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

